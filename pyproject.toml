[project]
name = "webai-to-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.25.0",
    "orjson>=3.9.0",
    "webai-to-api",
    "annotated-types==0.7.0 ; python_full_version >= '3.10' and python_full_version < '4'",
    "anyio==4.8.0 ; python_full_version >= '3.10' and python_full_version < '4'",
    "browser-cookie3==0.20.1 ; python_full_version >= '3.10' and python_full_version < '4'",
    "certifi==2024.12.14 ; python_full_version >= '3.10' and python_full_version < '4'",
    "cffi==1.17.1 ; python_full_version >= '3.10' and python_full_version < '4'",
    "click==8.1.8 ; python_full_version >= '3.10' and python_full_version < '4'",
    "colorama==0.4.6 ; python_full_version >= '3.10' and python_full_version < '4' and sys_platform == 'win32'",
    "curl-cffi==0.7.4 ; python_full_version >= '3.10' and python_full_version < '4'",
    "exceptiongroup==1.2.2 ; python_full_version == '3.10.*'",
    "fastapi==0.115.7 ; python_full_version >= '3.10' and python_full_version < '4'",
    "h11==0.14.0 ; python_full_version >= '3.10' and python_full_version < '4'",
    "h2==4.1.0 ; python_full_version >= '3.10' and python_full_version < '4'",
    "hpack==4.1.0 ; python_full_version >= '3.10' and python_full_version < '4'",
    "httpcore==1.0.7 ; python_full_version >= '3.10' and python_full_version < '4'",
    "httpx==0.28.1 ; python_full_version >= '3.10' and python_full_version < '4'",
    "hyperframe==6.1.0 ; python_full_version >= '3.10' and python_full_version < '4'",
    "idna==3.10 ; python_full_version >= '3.10' and python_full_version < '4'",
    "jeepney==0.8.0 ; (python_full_version >= '3.10' and python_full_version < '4' and 'bsd' in sys_platform) or (python_full_version >= '3.10' and python_full_version < '4' and sys_platform == 'linux')",
    "loguru==0.7.3 ; python_full_version >= '3.10' and python_full_version < '4'",
    "lz4==4.4.3 ; python_full_version >= '3.10' and python_full_version < '4'",
    "pycparser==2.22 ; python_full_version >= '3.10' and python_full_version < '4'",
    "pycryptodomex==3.21.0 ; python_full_version >= '3.10' and python_full_version < '4'",
    "pydantic-core==2.27.2 ; python_full_version >= '3.10' and python_full_version < '4'",
    "pydantic==2.10.6 ; python_full_version >= '3.10' and python_full_version < '4'",
    "pywin32==308 ; python_full_version >= '3.10' and python_full_version < '4' and sys_platform == 'win32'",
    "shadowcopy==0.0.4 ; python_full_version >= '3.10' and python_full_version < '4' and sys_platform == 'win32'",
    "sniffio==1.3.1 ; python_full_version >= '3.10' and python_full_version < '4'",
    "starlette==0.45.3 ; python_full_version >= '3.10' and python_full_version < '4'",
    "typing-extensions==4.12.2 ; python_full_version >= '3.10' and python_full_version < '4'",
    "uvicorn==0.34.0 ; python_full_version >= '3.10' and python_full_version < '4'",
    "win32-setctime==1.2.0 ; python_full_version >= '3.10' and python_full_version < '4' and sys_platform == 'win32'",
    "wmi==1.5.1 ; python_full_version >= '3.10' and python_full_version < '4' and sys_platform == 'win32'",
    "gemini-webapi",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
webai-to-api = { workspace = true }
gemini-webapi = { workspace = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
